<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CipherBridge · M3 颜色方案对比</title>
  <style>
    :root { --text: #1C1B1F; --muted: #49454F; --border: #CAC4D0; --bg: #FFFBFE; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 40px 24px; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    header h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.4px; }
    header p { color: var(--muted); margin-top: 8px; font-size: 15px; }
    .note { background: #F3EEFB; border-left: 4px solid #6750A4; border-radius: 8px; padding: 12px 16px; margin: 20px 0 8px; font-size: 14px; color: #21005D; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; margin-top: 28px; }
    .scheme { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: 0 10px 30px -18px rgba(0,0,0,0.25); }
    .scheme.current { border: 2px solid #6750A4; box-shadow: 0 14px 34px -18px rgba(103,80,164,0.4); }
    .scheme h2 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #EADDFF; color: #21005D; }
    .char { color: var(--muted); font-size: 13px; margin: 8px 0 14px; }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .swatch { width: 64px; height: 34px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.06); flex-shrink: 0; }
    .row .label { font-size: 12.5px; font-weight: 600; width: 118px; color: var(--text); }
    .row .var { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
    .row .hex { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 30px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px -18px rgba(0,0,0,0.25); }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; vertical-align: middle; }
    th { background: var(--bg); font-weight: 600; }
    td code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: #F3EEFB; padding: 2px 6px; border-radius: 6px; }
    td .mini { display: inline-block; width: 18px; height: 18px; border-radius: 4px; margin-right: 8px; border: 1px solid rgba(0,0,0,0.08); vertical-align: middle; }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 36px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>CipherBridge · Material 3 颜色方案对比</h1>
      <p>基于 <a href="https://m3.material.io/foundations/design-tokens">design tokens / color roles</a>。均为 M3 light scheme；卡片背景沿用 <code>#FFFFFF</code>。</p>
    </header>

    <div class="note">
      目标：与当前「M3 紫色基线 (<code>#6750A4</code>)」明确区分。每套方案只需改 <code>src/index.css</code> 的 <code>:root</code> 变量 + <code>--m3-primary-rgb</code>（透明光晕），以及 <code>App.tsx</code> 的 antd token。
    </div>

    <div class="grid" id="cards"></div>

    <!-- ================= 总览对比表 ================= -->
    <h2 style="margin-top:40px;font-size:20px;font-weight:700;">总览对比（hex）</h2>
    <table id="table"></table>

    <footer>由 M3 色板生成 · 种子色可用 Material Theme Builder 精确重建全套角色</footer>
  </div>

  <script>
    const base = [
      { var: "--primary-color",  label: "Primary",  hex: "#6750A4" },
      { var: "--primary-light",  label: "Primary Light", hex: "#EADDFF" },
      { var: "--primary-dark",   label: "Primary Dark", hex: "#21005D" },
      { var: "--bg-color",       label: "Background", hex: "#FFFBFE" },
      { var: "--text-primary",   label: "Text Primary", hex: "#1C1B1F" },
      { var: "--text-secondary", label: "Text Secondary", hex: "#49454F" },
      { var: "--border-color",   label: "Border", hex: "#CAC4D0" },
      { var: "--m3-primary-rgb", label: "Primary RGB", hex: "103,80,164" },
    ].map(t => ({ ...t, hex: t.hex.replace('#','') && t.hex }));

    const schemes = [
      {
        name: "① 靛青·科技 Oceanic Teal",
        current: false,
        char: "冷调、可信、偏科技与行业气质；和冷淡蓝紫 UI 反差明显。",
        seed: "#006A70",
        map: {
          "--primary-color": "#006A70", "--primary-light": "#A7F0EA",
          "--primary-dark": "#00201F", "--bg-color": "#FAFDFC",
          "--text-primary": "#191C1B", "--text-secondary": "#3F4948",
          "--border-color": "#BFC9C7", "--m3-primary-rgb": "0,106,112"
        }
      },
      {
        name: "② 琥珀暖阳 Amber Sunset",
        current: false,
        char: "暖金/橙，朝气、亲和、有活力；与冷色 UI 对比最强烈。",
        seed: "#7A5900",
        map: {
          "--primary-color": "#7A5900", "--primary-light": "#FFDF9E",
          "--primary-dark": "#261900", "--bg-color": "#FFF8F1",
          "--text-primary": "#201B13", "--text-secondary": "#50452F",
          "--border-color": "#D5C4A8", "--m3-primary-rgb": "122,89,0"
        }
      },
      {
        name: "③ 翡翠·金融 Mint Emeralds",
        current: false,
        char: "翠绿，清新自然，金融/健康/生活服务风格。",
        seed: "#006D46",
        map: {
          "--primary-color": "#006D46", "--primary-light": "#80F0B7",
          "--primary-dark": "#002115", "--bg-color": "#FAFDF8",
          "--text-primary": "#191D1A", "--text-secondary": "#3F4941",
          "--border-color": "#BFC9C0", "--m3-primary-rgb": "0,109,70"
        }
      },
      {
        name: "④ 灰蓝·珊瑚 Slate Coral",
        current: false,
        char: "中性暖灰底 + 珊瑚强调；更现代、克制、有记忆点。",
        seed: "#A8492C",
        map: {
          "--primary-color": "#A8492C", "--primary-light": "#FFDCCF",
          "--primary-dark": "#330F00", "--bg-color": "#FFF8F6",
          "--text-primary": "#221A18", "--text-secondary": "#52443F",
          "--border-color": "#D8C2BB", "--m3-primary-rgb": "168,73,44"
        }
      },
    ];

    // prepend current baseline as a reference card
    const current = { name: "现基线 · M3 紫（参考）", current: true, char: "当前已实现，作为对照；方案①~④需与它区分。", seed: "#6750A4",
      map: { "--primary-color":"#6750A4","--primary-light":"#EADDFF","--primary-dark":"#21005D","--bg-color":"#FFFBFE","--text-primary":"#1C1B1F","--text-secondary":"#49454F","--border-color":"#CAC4D0","--m3-primary-rgb":"103,80,164" } };

    const order = ["--primary-color","--primary-light","--primary-dark","--bg-color","--text-primary","--text-secondary","--border-color","--m3-primary-rgb"];

    function renderCards() {
      const cards = document.getElementById('cards');
      [current, ...schemes].forEach(s => {
        const el = document.createElement('div');
        el.className = 'scheme' + (s.current ? ' current' : '');
        const rows = order.map(v => {
          const val = s.map[v];
          const isRgb = v === '--m3-primary-rgb';
          const bg = isRgb ? `rgb(${val})` : val;
          const hexShow = isRgb ? `rgb(${val})` : val;
          return `<div class="row">
            <div class="swatch" style="background:${bg}"></div>
            <div class="label">${s.map[v]===undefined?'':''}${ v.replace(/^--/,'').replace(/-/g,' ')}</div>
            <div class="var">${v}</div>
            <div class="hex">${hexShow}</div>
          </div>`;
        }).join('');
        el.innerHTML = `
          <h2>${s.name} ${s.current ? '<span class="badge">当前</span>' : ''}</h2>
          <div class="char">种子 ${s.seed} · ${s.char}</div>
          <div class="rows">${rows}</div>`;
        cards.appendChild(el);
      });
    }

    function renderTable() {
      const t = document.getElementById('table');
      const vars = order;
      const heads = ['变量', ...[current, ...schemes].map(s => s.name.split(' ')[0])];
      let html = '<thead><tr>' + heads.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
      vars.forEach(v => {
        html += '<tr><td><code>' + v + '</code></td>';
        [current, ...schemes].forEach(s => {
          const val = s.map[v];
          const isRgb = v === '--m3-primary-rgb';
          const bg = isRgb ? `rgb(${val})` : val;
          html += `<td><span class="mini" style="background:${bg}"></span><code>${isRgb?`rgb(${val})`:val}</code></td>`;
        });
        html += '</tr>';
      });
      html += '</tbody>';
      t.innerHTML = html;
    }

    renderCards();
    renderTable();
  </script>
</body>
</html>
