[package]
name = "hello_guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "1.2.0", default-features = false, features = ['std', 'heap-embedded-alloc'] }
#risc0-zkvm = { version = "1.1.3" }
#serde = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
bincode = "1.3"
#rayon = "1.7"
tfhe = { path = "../../../tfhe-rs-main/tfhe" }
tfhe-fft = { path = "../../../tfhe-rs-main/tfhe-fft" }

#tfhe = { version = "0.8.4", features = [ "boolean", "shortint", "pbs-stats", "integer", "aarch64-unix" ] }
concrete-ntt ={ version = "0.2.0"}

# guest 由 risc0 guest 工具链（rzup rust 1.85.0）编译，其 core 里 Layout 的方法名是 `dangling()`；
# 较新的 rustc（如 host 用的 stable 1.98）已改名为 `dangling_ptr()`。embedded-alloc 0.6.0 用旧名，
# 这里用 vendor 里的**同版本**副本替换，方便随工具链升级统一改名（版本号不变，满足 risc0 的 ^0.6 约束）。
# 改名与探测逻辑见 tools/setup_zk_env.sh 的 detect_dangling_api / 5-3。
[patch.crates-io]
embedded-alloc = { path = "../../../vendor/embedded-alloc-0.6.0" }


