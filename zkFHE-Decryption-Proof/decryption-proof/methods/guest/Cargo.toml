[package]
name = "hello_guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "1.2.0", default-features = false, features = ['std', 'heap-embedded-alloc'] }
#risc0-zkvm = { version = "1.1.3" }
#serde = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
bincode = "1.3"
#rayon = "1.7"
tfhe = { path = "../../../tfhe-rs-main/tfhe" }
tfhe-fft = { path = "../../../tfhe-rs-main/tfhe-fft" }

#tfhe = { version = "0.8.4", features = [ "boolean", "shortint", "pbs-stats", "integer", "aarch64-unix" ] }
concrete-ntt ={ version = "0.2.0"}

# 本机 risc0 工具链的 rustc 已把 `Layout::dangling` 改名为 `dangling_ptr`，
# 而 risc0 的 heap-embedded-alloc 特性依赖 embedded-alloc 0.6.0（用了旧名字 → 编译失败）。
# 这里用 vendor 里打了 2 行补丁的**同版本**副本替换（版本号不变，满足 risc0 的 ^0.6 约束）。
[patch.crates-io]
embedded-alloc = { path = "../../../vendor/embedded-alloc-0.6.0" }


